<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blink — flashcards com IA a partir do seu próprio material</title>
<meta name="description" content="O Blink transforma seu PDF, slide, Word, imagem ou um tópico digitado em decks de flashcards com repetição espaçada. As figuras do seu material viram as imagens dos cards.">
<meta name="theme-color" content="#e2e2df">
<link rel="icon" type="image/svg+xml" href="/assets/brand/blink_favicon.svg">

<meta property="og:type" content="website">
<meta property="og:title" content="Blink — flashcards com IA a partir do seu próprio material">
<meta property="og:description" content="Transforme PDF, slide, Word, imagem ou um tópico digitado em decks prontos. Repetição espaçada que decide quando você revisa.">
<meta property="og:locale" content="pt_BR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // Aplica o tema antes da pintura para não piscar.
  (function () {
    var t;
    try { t = localStorage.getItem('blink-theme'); } catch (e) {}
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'dark') document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
